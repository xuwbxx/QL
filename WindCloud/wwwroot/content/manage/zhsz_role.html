	    <div class="modal fade" id="tk_Roleadd" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true" data-backdrop="static">
			<div class="modal-dialog modal-dialog-s">
				<div class="modal-content">
					<div class="modal-header">
						<button type="button" class="close" data-dismiss="modal" aria-hidden="true"> 
							&times;
						</button>
						<h4 class="modal-title">
							新增角色
						</h4>
					</div>
					<div class="modal-body">
						 <form class="clearfix">
							 
							  <div class="col-md-12 mar_b10">
								    <label class="tk_label">
										 <span class="text-red">*</span>姓名
									</label>
							        <div class="tk_div_input"><input class="form-control" type="text" placeholder="请输入姓名"></div>
							  </div>
							  <div class="col-md-12 mar_b10">
								    <label class="tk_label">
										 角色编码
									</label>
							        <div class="tk_div_input"><input class="form-control" type="text" placeholder="请输入角色编码" disabled></div>
							  </div>
							  <div class="col-md-12 mar_b10">
								    <label class="tk_label">
										 请输入部门名称  
									</label>
							        <div class="tk_div_input"><input class="form-control" type="text" placeholder="请输入部门名称" disabled></div>
							  </div>
							 <div class="col-md-12 mar_b10">
								    <label class="tk_label">
										手机号  
									</label>
							        <div class="tk_div_input"><input class="form-control" type="text" placeholder="请输入手机号" disabled></div>
							  </div>
							 <div class="col-md-12 mar_b10">
								    <label class="tk_label">
										 职位  
									</label>
							        <div class="tk_div_input"><input class="form-control" type="text" placeholder="请输入职位" disabled></div>
							  </div>
						 </form>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-primary"><i class="fa fa-arrow-down"></i>保存</button>
						<button type="button" class="btn btn-default" data-dismiss="modal"><i class="fa fa-reply"></i>返回</button>
					</div>
				</div>
			</div>

					</div>

					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-primary"><i class="fa fa-check-square-o zdy_icon"></i>确定</button>
						<button type="button" class="btn btn-default" data-dismiss="modal"><i class="fa fa-reply zdy_icon"></i>取消</button>
					</div>
				</div>
			</div>
