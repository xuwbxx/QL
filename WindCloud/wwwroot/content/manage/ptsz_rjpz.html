<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<title>后台</title>
<meta name="renderer" content="webkit">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="shortcut icon" href="images/title-logo.ico" type="image/x-icon"/>
	
<link rel="stylesheet" type="text/css" href="css/font-awesome.4.6.0.css">	
<link rel="stylesheet" href="css/bootstrap.min.css">	
<link rel="stylesheet" href="css/style.css">  
	
<script type="text/javascript" src="js/jQuery v3.2.1.js"></script>
<script src="js/bootstrap.min.js"></script> 	
	
</head>
  
  <body>
	  
	    <div class="div_body">
			
	        <div class="div_form">
	          
			  <form class="form-inline">
					<div class="form-group">
						<input type="text" class="form-control" placeholder="请输入软件名称">
					</div>
					<div class="form-group">
						 <button type="button" class="btn btn-primary"><i class="fa fa-search"></i></button>
					</div>
			  </form>
	        </div>
			
		    
			
			<div class="div_table">
			     <table class="table table-hover table_chongzhi">
				        <thead>
					           <tr>
								   <th width="25%">软件名称</th>
							       <th width="25%">软件类型</th>
								   <th width="25%">软件地址</th>
								   <th width="25%">操作</th>
							   </tr>
					    </thead>
					    <tbody>
					          <tr>
								  <td>海上风电WebGIS平台</td>
							      <td>使用类</td>
								  <td>节点类型</td>
								  <td>
									  <button type="button" class="btn btn-primary-s" onClick="PopupEdit();"><i class="fa fa-pencil-square-o table_icon"></i>编辑</button>
								  </td> 
							  </tr> 
							  <tr>
								  <td>自升式平台桩腿插拔计算</td>
							      <td>委托类</td>
								  <td>节点类型</td>
								  <td> 
									   <button type="button" class="btn btn-primary-s" onClick="PopupEdit();"><i class="fa fa-pencil-square-o table_icon"></i>编辑</button>
								  </td> 
							  </tr> 
							 
					    </tbody>
					    
				 </table>

				
				
			</div>
	    </div>
	  	
       <!--配置节点人员弹框-->
	    <div class="modal fade" id="tk_Edit" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true" data-backdrop="static">
			<div class="modal-dialog modal-dialog-s">
				<div class="modal-content"> 
					<div class="modal-header">
						<button type="button" class="close" data-dismiss="modal" aria-hidden="true"> 
							&times;
						</button>
						<h4 class="modal-title">
							海上风电WebGIS平台
						</h4>
					</div>
					<div class="modal-body">
			             
						 
						 <form class="clearfix">
							 
							  <div class="col-md-12 mar_b10">
								    <label class="tk_label">
										 软件名称
									</label>
							        <div class="tk_div_input"><input class="form-control" type="text" placeholder="请输入姓名" disabled></div>
							  </div>
							  <div class="col-md-12 mar_b10">
								    <label class="tk_label">
										 软件类型
									</label>
							        <div class="tk_div_input">
								         <select class="form-control">
										         <option>使用类</option>
											     <option>委托类</option>
										 </select>
								    </div>
							  </div>
							  <div class="col-md-12 mar_b10">
								    <label class="tk_label">
										 软件地址  
									</label>
							        <div class="tk_div_input"><input class="form-control" type="text" placeholder="请输入软件地址"></div>
							  </div>
						 </form>
						
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-primary"><i class="fa fa-arrow-down"></i>保存</button>
						<button type="button" class="btn btn-default" data-dismiss="modal"><i class="fa fa-reply"></i>返回</button>
					</div>
				</div>
			</div>
		</div>
       <!--配置节点人员弹框-->

	  
	  <script>
	          var PopupEdit = function () {
				  
				  $('#tk_Edit').modal('show');
				  
			  }

	  </script>
	  
	  
	 </body>
</html>
